[package]
name = "jianpubook-desktop"
version = "0.1.0"
description = "JianpuBook desktop shell"
edition = "2021"

[lib]
name = "jianpubook_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
img-pipeline = { path = "../../../crates/img-pipeline" }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"

[features]
default = []
